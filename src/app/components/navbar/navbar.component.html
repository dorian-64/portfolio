<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="nav-brand">
      <span class="brand-icon">&#10084;</span>
      <span class="brand-name">HeartSync</span>
    </a>

    <div class="nav-links" [class.open]="menuOpen">
      <ng-container *ngIf="currentUser; else guestNav">
        <a routerLink="/decouvrir" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">&#128269;</span> Découvrir
        </a>
        <a routerLink="/matchs" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">&#10084;</span> Matchs
        </a>
        <a routerLink="/profil" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">&#128100;</span> Profil
        </a>
        <a routerLink="/parametres" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">&#9881;</span> Paramètres
        </a>
        <button (click)="logout()" class="btn-logout">Déconnexion</button>
      </ng-container>
      <ng-template #guestNav>
        <a routerLink="/connexion" class="nav-link">Connexion</a>
        <a routerLink="/inscription" class="btn-register">S'inscrire</a>
      </ng-template>
    </div>

    <button class="hamburger" (click)="toggleMenu()" *ngIf="currentUser">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
